# Classifier actions (Layer 3) — mirrors Appendix C of comms-migration-runbook.md
# Executed by Nextiva workflows (professional voice/SMS) or the Phase 5 Python
# classifier (classifier/) for email across all mapped accounts.
#
# Each category:
#   trigger_signals   — sender/content heuristics rules_engine.py and the LLM
#                        fallback use to recognize the category
#   default_action    — one of the action_tiers below
#   target_hub        — professional | personal | split | n/a (funnel-only)
#   human_in_loop     — true = never auto-archive/auto-send without review
#   sensitivity       — low | medium | high (high = financial/identity data;
#                        never auto-quarantine or auto-delete, flag instead)
#
# Unmatched/ambiguous senders fall through to the LLM classifier
# (classifier/llm_classify.py), which assigns the closest category above.
# True unknowns land in spam_unknown.

categories:
  # --- Highest priority — never auto-archive, regardless of topic ---
  security_alert:
    trigger_signals:
      - account sign-in / new-device notifications
      - password reset or change confirmations
      - 2FA/MFA codes and "verify it's you" prompts
      - account recovery or suspicious-activity warnings
    default_action: notify_now
    target_hub: n/a  # cuts across professional/personal; always surfaced regardless of hub
    human_in_loop: true
    sensitivity: high
    # Added 2026-07-04 after a real Google "Security alert" email was
    # auto-archived under financial_admin by the LLM fallback (it matched on
    # loose account/financial topic association, not message intent). This
    # category exists specifically to short-circuit that failure mode via
    # rules_engine.py sender/domain matches (see rules/rules.yaml)
    # so it never depends on the LLM correctly inferring intent.

  # --- High-touch / already-automated (existing) ---
  active_client:
    trigger_signals:
      - known client domain or number
      # Per user decision (2026-07-06): a recruiter-appointment email from a
      # hiring client you're ALREADY engaged with (e.g. an interview
      # scheduling note, an ATS "keep receiving email" preference
      # confirmation like the Waystar rule below) is active_client, not
      # recruiter_job — recruiter_job is for job-board alerts and cold
      # outreach about a NEW opportunity, not ongoing communication about
      # one you're already pursuing. No concrete rule exists yet beyond the
      # Waystar example (see rules/rules.yaml) since no other named hiring
      # client has sent this kind of mail yet; add a scoped from/subject
      # rule here (mirroring the Waystar one) the next time one does.
    default_action: notify_now
    sub_actions:
      - draft_reply
    target_hub: professional
    human_in_loop: true
    sensitivity: medium

  # recruiter_job: any email that lists a single job (with or without a named
  # human recruiter) — this includes automated single-job-alert mail (e.g.
  # LinkedIn Job Alerts/Recommendations) as well as personalized recruiter
  # outreach. A short-lived "job_digest" category (2026-07-05) tried to split
  # these out separately, but was reverted the same day: not worth the extra
  # taxonomy complexity, and job-tracker's recruiting_funnel queue is
  # label-only/never-archived there anyway (see NEVER_ARCHIVE_CATEGORIES_BY_ACCOUNT
  # in classifier/actions.py), so extra volume doesn't cost anything.
  recruiter_job:
    trigger_signals:
      - recruiter language
      - job description content
      - scheduling language
      - single-job alert/recommendation mail from a job board (LinkedIn, Ladders, etc.)
      # NOT this category: appointment/scheduling mail from a hiring client
      # you're already engaged with — see active_client's trigger_signals
      # above for that distinction (2026-07-06 decision).
    default_action: label_archive  # labeled + archived; job-tracker's query isn't scoped to in:inbox, so it still finds these
    sub_actions:
      - match_triage
      - draft_acknowledgment_for_review
    target_hub: n/a  # stays in the recruiting funnel; job-tracker owns processing
    human_in_loop: false
    sensitivity: medium
    subcategories:
      - recruiter_initial_call
      - recruiter_follow_up

  personal:
    trigger_signals:
      - known personal contact
    default_action: route
    target_hub: personal
    human_in_loop: false
    sensitivity: low

  # --- Sensitive / financial ---
  # financial_admin, investing, billing: promoted to auto-archive (2026-07-04)
  # after review of real traffic showed these are routine notices, not
  # actionable items. insurance stays flag-only/human-in-loop below since it
  # hasn't been reviewed yet.
  financial_admin:
    trigger_signals:
      - banks
      - general account notices
      - tax documents
    default_action: label_archive
    target_hub: split
    human_in_loop: false
    sensitivity: high

  investing:
    trigger_signals:
      - brokerage statements
      - trade confirmations
      - 401k / retirement account notices
    default_action: label_archive
    target_hub: personal
    human_in_loop: false
    sensitivity: high

  insurance:
    trigger_signals:
      - health/auto/home insurance (personal)
      - business liability insurance (professional)
    default_action: flag
    target_hub: split  # health/auto/home -> personal; Spexture liability -> professional
    human_in_loop: true
    sensitivity: high

  # Added 2026-07-06 per user request: doctor/dentist/pharmacy appointment
  # notices. flag (not label_archive) since missing a medical appointment
  # has real consequences — stays visible in the inbox like insurance,
  # rather than being auto-archived like the routine financial categories.
  medical:
    trigger_signals:
      - doctor/dentist appointment reminders (practice-management platforms
        like AdvancedMD, RemindMeMD, Promptly, PromptHealth)
      - pharmacy notices
    default_action: flag
    target_hub: personal
    human_in_loop: true
    sensitivity: high

  billing:
    trigger_signals:
      - subscription renewal
      - invoice
      - payment receipt with stored payment method
    default_action: label_archive
    target_hub: split  # Spexture tools/subscriptions -> professional; personal subs -> personal
    human_in_loop: false
    sensitivity: high

  # --- Low-stakes bulk mail — safe to auto-label + auto-archive ---
  vendor_transactional:
    trigger_signals:
      - receipts
      - confirmations
      - shipping notifications
    default_action: label_archive
    target_hub: personal
    human_in_loop: false
    sensitivity: low

  political:
    trigger_signals:
      - campaign/advocacy newsletters
      - political fundraising language
    default_action: label_archive
    target_hub: personal
    human_in_loop: false
    sensitivity: low

  social:
    trigger_signals:
      - social network notifications
      - event invites (Evite/Meetup/Facebook Events)
      - community/group digests
    default_action: label_archive
    target_hub: personal
    human_in_loop: false
    sensitivity: low

  news:
    trigger_signals:
      - news outlet digests
      - subscribed news alerts
    default_action: label_archive
    target_hub: personal
    human_in_loop: false
    sensitivity: low

  ai:
    trigger_signals:
      - AI product/tool newsletters
      - AI vendor product updates (non-job, non-billing)
    default_action: label_archive
    target_hub: personal
    human_in_loop: false
    sensitivity: low

  church:
    trigger_signals:
      - ward/stake communications
    default_action: label_archive
    target_hub: personal
    human_in_loop: false
    sensitivity: low

  # Added 2026-07-06 per user request: hobby/model-kit retailer promo mail
  # (Mr. Hobby / Gaia paints, Kitlinx newsletters, etc.) — was previously
  # falling into spam_unknown. Routine low-stakes bulk mail, same tier as
  # social/news.
  hobby:
    trigger_signals:
      - hobby/model-kit retailer newsletters (paints, kits, tools)
    default_action: label_archive
    target_hub: personal
    human_in_loop: false
    sensitivity: low

  spam_unknown:
    trigger_signals:
      - unrecognized sender
    default_action: quarantine
    target_hub: n/a
    human_in_loop: false
    sensitivity: low

# Action tier precedence (Phase 5 automation promotion path).
# label_archive/quarantine/route/tag are fully automated; flag/notify_now/
# draft_for_approval always keep a human in the loop.
action_tiers:
  - notify_now
  - flag
  - tag
  - route
  - label_archive
  - digest
  - draft_for_approval
  - quarantine
  - auto_handle
