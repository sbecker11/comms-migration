# rules/rules.yaml — Layer 3 fast-path rule list. LIVE as of 2026-07-04,
# replacing the old rules/category_rules.yaml domain/email dicts.
#
# An ordered list of named, toggleable rules modeled on Mail.app's rule
# editor (see the "Add Rule" screenshots from 2026-07-04) — each rule has a
# description, an any/all combinator, one or more field/comparator/value
# expressions, and an action. This file started as a 1:1 behavioral port of
# category_rules.yaml (verified byte-for-byte equivalent on all 127
# domain/email entries plus lookalike-domain edge cases before cutover —
# see git history for the comparison), PLUS one new example (Subject-based)
# showing what this schema can do that plain domain matching couldn't.
#
# Evaluated by classifier/rules_v2_engine.py, validated against
# rules/rules_schema.json — see classifier/rules_engine.py for how this
# fits into the full resolution order (rules -> senders.yaml -> LLM).
#
# Scope (per 2026-07-04 discussion):
#   - This only replaces the category_rules.yaml matching layer.
#   - rules/senders.yaml (contact -> hub) is untouched.
#   - rules/actions.yaml (category -> archive/notify/flag policy) is
#     untouched — a rule's only action is `add_label: <category>`; what
#     happens to that category (archive/flag/notify) still lives in
#     actions.yaml, so that policy is defined once per category instead of
#     once per rule.
#
# Evaluation semantics:
#   - Rules are evaluated TOP TO BOTTOM. The first ACTIVE rule that matches
#     wins (equivalent to every Mail.app rule having "stop evaluating
#     rules" checked) — a message has exactly one category, so first-match
#     is simpler than Mail.app's "run every matching rule" default.
#   - `active: false` disables a rule without deleting it (mirrors the
#     Active checkbox column in Mail.app's rule list).
#   - `combinator: any` = OR across expressions, `all` = AND.
#   - A `combinator: all` rule whose expressions can never ALL be true for
#     any message (e.g. date_sent less_than_days_old 7 AND
#     greater_than_days_old 8 — no day-count satisfies both) fails loudly
#     at load time (classifier/rules_schema_validate.py) instead of
#     silently compiling into a rule that never matches anything. Only a
#     conservative set of contradictions is caught this way — see
#     _find_unsatisfiable_expressions()'s docstring for exactly which.
#
# Fields available in an expression:
#   String fields      — from, to, cc, subject, body
#     Comparators: contains | does_not_contain | begins_with | ends_with | equals
#     (case-insensitive; `body` == Mail.app's "Message content")
#   Pattern fields      — from_url_pattern (regex, matched with re.search
#     against the FULL sender address — not domain-only, so it can target
#     local-part patterns too, e.g. 'noreply@' or a specific subdomain
#     structure, not just "ends with this registered domain"), and
#     subject_pattern (same re.search semantics, but against the subject
#     line — added 2026-07-06 for word-boundary-safe matching a plain
#     `subject contains` comparator can't express, e.g. '\bAI\b' matching
#     "AI" as its own word/acronym without false-positiving on "said",
#     "main", "available", "maintain", etc.)
#     Comparators: matches | does_not_match   (value: a regex pattern string)
#     Since this is `re.search`, not `re.fullmatch`, an unanchored pattern
#     like 'nytimes\.com' would match ANYWHERE in the address/subject — use
#     '^'/'$' to anchor when that matters. The domain-suffix rules below use
#     the idiom '@([\w-]+\.)*DOMAIN$' (matches DOMAIN or any subdomain of
#     it, anchored at the end of the address, right after the lone '@') to
#     replicate the old dot-boundary-safe behavior explicitly rather than
#     silently baking it into a comparator.
#     A malformed regex value fails loudly at load time (see
#     classifier/rules_schema_validate.py) rather than silently no-op'ing.
#   Date fields         — date_sent, date_received
#     Comparators: less_than_days_old | greater_than_days_old  (value: integer)
#     The message's own date_sent/date_received are represented internally
#     as `Iso8601Utc` (classifier/rules_v2_engine.py) — an ISO-8601 string
#     with an explicit UTC offset, e.g. "2026-07-04T16:00:00Z". This is the
#     ONE date format the engine ever parses, regardless of source; Gmail's
#     native formats (the RFC 2822 "Date" header for date_sent, epoch-ms
#     internalDate for date_received) are converted to it once, at the
#     source (classifier/gmail_client.py), not by every consumer. This is
#     about the MESSAGE's dates, not this field's `value` above (which
#     stays a plain integer day count either way).
#
# Action:
#   add_label: <category>   — must be a key in rules/actions.yaml's `categories:`

rules:
  # --- Highest priority — never auto-archive, regardless of topic ---
  - description: "Security alerts (Google)"
    active: true
    combinator: any
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*accounts\.google\.com$'
    action:
      add_label: security_alert

  - description: "Security alerts (Microsoft)"
    active: true
    combinator: any
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*accountprotection\.microsoft\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*account\.microsoft\.com$'
    action:
      add_label: security_alert

  - description: "Security alerts (Apple / named senders)"
    active: true
    combinator: any
    expressions:
      - field: from
        comparator: equals
        value: appleid@id.apple.com
      - field: from
        comparator: equals
        value: account-security-noreply@accountprotection.microsoft.com
    action:
      add_label: security_alert

  # Domain-agnostic fallback for the exact failure mode security_alert was
  # created for (see actions.yaml's comment on this category): the three
  # sender-specific rules above only cover known providers (Google,
  # Microsoft, Apple). Any OTHER site's password-reset/change notice (e.g.
  # a university alumni portal, a random SaaS vendor) has no sender rule
  # here, falls through to the LLM, and the LLM can misjudge it as
  # "personal" or "financial_admin" rather than recognizing the security
  # intent — exactly what happened 2026-07-05 with an MIT alumni portal's
  # "Infinite Connection: password updated"/"reset password instructions"
  # emails. This rule catches that language regardless of sender.
  - description: "Security alerts (password/account activity, any sender)"
    active: true
    combinator: any
    expressions:
      - field: subject
        comparator: contains
        value: "password reset"
      - field: subject
        comparator: contains
        value: "reset password"
      - field: subject
        comparator: contains
        value: "password updated"
      - field: subject
        comparator: contains
        value: "password changed"
      - field: subject
        comparator: contains
        value: "verify your identity"
      - field: subject
        comparator: contains
        value: "new sign-in"
      - field: subject
        comparator: contains
        value: "security alert"
      - field: subject
        comparator: contains
        value: "suspicious activity"
      - field: subject
        comparator: contains
        value: "unusual activity"
    action:
      add_label: security_alert

  # --- Active client ---
  # Waystar's Workday-hosted candidate-communications preference email — an
  # active-application signal from a named employer, not a generic job-board
  # alert, per user request (2026-07-06). from is the exact sender address
  # (myworkday.com is a shared multi-tenant ATS domain — matching that alone
  # would catch every OTHER company's Workday mail too), AND'd with the
  # subject so this stays scoped to this one email, not anything else
  # Waystar's ATS might send.
  - description: "Waystar — keep receiving email preference confirmation"
    active: true
    combinator: all
    expressions:
      - field: from
        comparator: equals
        value: waystar@myworkday.com
      - field: subject
        comparator: contains
        value: "Keep Receiving Our Email"
    action:
      add_label: active_client

  # --- News ---
  - description: "News outlets"
    active: true
    combinator: any
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*nytimes\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*washingtonpost\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*wsj\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*theatlantic\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*axios\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*theskimm\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*morningbrew\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*substack\.com$' # many news/opinion newsletters; override per-sender if needed
    action:
      add_label: news

  # --- NEW: subject-based rule — not expressible in the old domain-only
  # schema. Mirrors your Mail.app rule "There's an ai for that" by name;
  # adjust `value` to the actual newsletter's subject pattern once ported.
  - description: "There's an AI for that (subject match)"
    active: true
    combinator: any
    expressions:
      - field: subject
        comparator: contains
        value: "There's An AI For That"
    action:
      add_label: ai

  # --- Job alert senders (single-job automated mail) ---
  # Must come before "Social networks" below: linkedin.com's job-alert
  # senders would otherwise be shadowed by that rule's generic linkedin.com
  # match (first-match-wins — see rules_v2_engine.first_matching_label).
  # These count as recruiter_job even though they're automated, not from a
  # named human recruiter — see rules/actions.yaml's recruiter_job entry
  # (a short-lived separate "job_digest" category was tried and reverted
  # 2026-07-05 as unnecessary complexity).
  - description: "Job alert senders (LinkedIn Job Alerts/Recommendations, Ladders)"
    active: true
    combinator: any
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '^jobalerts-noreply@linkedin\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '^jobs-noreply@linkedin\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*theladders\.com$'
    action:
      add_label: recruiter_job

  # LinkedIn InMail (direct recruiter outreach, or a reply notification for
  # one) — distinct from the job-BOARD alert senders above. Added
  # 2026-07-06, originally scoped to subject contains "New job opportunity"
  # after that exact InMail template was falling into Social networks
  # below via linkedin.com's generic domain match; broadened the same day
  # after a second InMail ("Sr. AI Full Stack Engineer in Des Moines, IA
  # (Onsite)") used a different subject convention entirely, to match on
  # sender address alone (inmail-hit-reply@ / hit-reply@linkedin.com are
  # LinkedIn's dedicated InMail/InMail-reply-notification addresses).
  #
  # NARROWED again the same day: sender-alone turned out to be too broad
  # once more real InMail traffic came in — "Come join our network of
  # consultants @ Equal Experts!" and generic "Message replied: <no job
  # info>" notifications from these SAME addresses are network/social
  # outreach, not job opportunities, and the user asked those stay in
  # Social. So each rule below now requires the InMail sender AND a
  # subject phrase that actually signals job content. The combined regex
  # '^(inmail-)?hit-reply@linkedin\.com$' matches both dedicated InMail
  # addresses in one expression. Must come before "Social networks" below
  # for first-match-wins (see rules_v2_engine.first_matching_label) —
  # anything from these addresses NOT matching one of these subject
  # phrases correctly falls through to Social networks.
  - description: "LinkedIn InMail — new job opportunity"
    active: true
    combinator: all
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '^(inmail-)?hit-reply@linkedin\.com$'
      - field: subject
        comparator: contains
        value: "New job opportunity"
    action:
      add_label: recruiter_job

  - description: "LinkedIn InMail — Hiring for ..."
    active: true
    combinator: all
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '^(inmail-)?hit-reply@linkedin\.com$'
      - field: subject
        comparator: contains
        value: "Hiring for"
    action:
      add_label: recruiter_job

  - description: "LinkedIn InMail — Software Engineer Opportunity"
    active: true
    combinator: all
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '^(inmail-)?hit-reply@linkedin\.com$'
      - field: subject
        comparator: contains
        value: "Software Engineer Opportunity"
    action:
      add_label: recruiter_job

  # Onsite/Remote/Hybrid work-arrangement tags — same convention job boards
  # use in title/subject lines (e.g. "Sr. AI Full Stack Engineer in Des
  # Moines, IA (Onsite)" from 2026-07-06's CLAUDE.md onsite-dealbreaker
  # fix). Originally two separate rules requiring the literal parenthesized
  # "(Onsite)"/"(Remote)" strings; broadened the same day (still 2026-07-06)
  # after "Machine Learning Engineer - 6-12+ months - Remote" — no
  # parens — fell through to Social networks instead. Word-boundary match
  # so it still requires a standalone tag, not e.g. "remotely". Excludes
  # "Message replied:" notifications — the user explicitly asked those stay
  # in Social regardless of what job-ish text the replied-to message
  # contains (e.g. "Message replied: 100% REMOTE Full-Stack Engineer @
  # CVS"); only a genuine new InMail (no "Message replied:" wrapper) with
  # this tag counts.
  - description: "LinkedIn InMail — Onsite/Remote/Hybrid tagged role"
    active: true
    combinator: all
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '^(inmail-)?hit-reply@linkedin\.com$'
      - field: subject_pattern
        comparator: matches
        value: '\b(Onsite|Remote|Hybrid)\b'
      - field: subject
        comparator: does_not_contain
        value: "Message replied"
    action:
      add_label: recruiter_job

  # LinkedIn connection-invitation notifications (invitations@linkedin.com)
  # — a different sender/purpose than the InMail addresses above. Scoped
  # to the exact "I want to connect" template per user request
  # (2026-07-06): unlike the near-identical "I've sent you a connection
  # request" template (see docs/CATEGORY_HANDLER note — deliberately NOT
  # auto-routed, since that one covers routine non-recruiter connections
  # too and the user asked for manual re-routing instead; see
  # scripts/recategorize_message.py), "I want to connect" was specifically
  # called out as recruiter-signal.
  - description: "LinkedIn — I want to connect (invitations)"
    active: true
    combinator: all
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '^invitations@linkedin\.com$'
      - field: subject
        comparator: contains
        value: "I want to connect"
    action:
      add_label: recruiter_job

  # LinkedIn's generic "X just messaged you" digest (messaging-digest-noreply@)
  # doesn't carry the sender's email, only their first name in the subject —
  # unlike the dedicated InMail addresses above, this digest fires for ANY
  # LinkedIn connection, so it can't be scoped by sender alone. Scoped to
  # "Andrew" specifically per user request (2026-07-06): Andrew Case is a
  # known, actively-communicating contact who should be treated like
  # active_client, not generic Social networks. Risk: another LinkedIn
  # connection literally named Andrew would also match — accepted for now
  # given no other identifying signal is available in this digest format.
  - description: "LinkedIn message digest — Andrew (Case), active contact"
    active: true
    combinator: all
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '^messaging-digest-noreply@linkedin\.com$'
      - field: subject
        comparator: contains
        value: "Andrew"
    action:
      add_label: active_client

  # --- Social ---
  - description: "Social networks"
    active: true
    combinator: any
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*facebookmail\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*linkedin\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*meetup\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*eventbrite\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*nextdoor\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*x\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*twitter\.com$'
    action:
      add_label: social

  # --- Political ---
  - description: "Political / campaign senders (Politics Junk)"
    active: true
    combinator: any
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*actblue\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*winred\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*mobilize\.us$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*votesaveamerica\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*unitedamericangop\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*virtuousconservatives\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*marshablackburn\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*stayinformednow\.com$'
      # Added 2026-07-05 from real personal_hub sender-domain analysis after
      # the inbox-flood incident (see comms-migration-runbook.md) — these
      # were all falling through to the LLM at ~$0.002+/message.
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*donaldjtrump\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*nrsc\.org$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*housegopmajority\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*rnchq\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*nrccwin\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*vanorden4congress\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*thenrcc\.org$'
    action:
      add_label: political

  # --- AI vendors ---
  - description: "AI product/tool newsletters"
    active: true
    combinator: any
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*openai\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*anthropic\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*mistral\.ai$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*perplexity\.ai$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*cursor\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*cursor\.sh$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*huggingface\.co$'
      - field: from
        comparator: equals
        value: noreply@anthropic.com
      # Added 2026-07-06 (2nd pass): dedicated AI newsletters found split
      # inconsistently across ai/news/spam_unknown by the LLM fallback
      # before these existed — the "There's an AI for that" rule above only
      # matched one specific subject template, missing its other sends
      # (e.g. "🦾 AI Turns Your Walk Into a Sprint").
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*theresanaiforthat\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*alphasignal\.ai$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*ollama\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*augmentcode\.com$'
    action:
      add_label: ai

  # --- Church ---
  - description: "Church of Jesus Christ communications"
    active: true
    combinator: any
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*churchofjesuschrist\.org$'
    action:
      add_label: church

  # FamilySearch (familysearch.org) and MyHeritage Discovery are genealogy/
  # family-history services — routed to church rather than social/spam_unknown
  # per user request (2026-07-06), since family history is treated as part of
  # this category alongside ward/stake communications.
  - description: "Family history (FamilySearch / MyHeritage)"
    active: true
    combinator: any
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*familysearch\.org$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*myheritage\.com$'
    action:
      add_label: church

  # --- Recruiter / job ---
  - description: "Recruiter / job boards"
    active: true
    combinator: any
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*indeed\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*jobcase\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*ziprecruiter\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*jobhat\.com$' # added 2026-07-06: "New job openings posted near you!"
      # Added 2026-07-06 (2nd pass): recurring job-board/staffing-agency
      # domains found repeatedly falling through to the (paid) LLM fallback
      # or getting mislabeled by the AI-subject fallback rule below when a
      # job title happened to mention "AI" (e.g. diverselynx.com's "RE: ...
      # Full stack GenAI/Agentic AI" recruiter thread).
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*bebee\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*energyjobline\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*roberthalf\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*job\-tree\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*lensa\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*jobot\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*jobs2web\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*obrajobs\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*diverselynx\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*sysmind\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*msrtechnologies\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*navasoftware\.com$'
    action:
      add_label: recruiter_job

  # --- Vendor / transactional ---
  - description: "Vendor / shipping / transactional receipts"
    active: true
    combinator: any
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*amazon\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*amazonses\.com$' # transactional/receipt sender infra
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*shipment\-tracking\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*ups\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*fedex\.com$'
      - field: from_url_pattern
        comparator: matches
