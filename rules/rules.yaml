  # "Action Needed - Your Transaction ... Has Been Cancelled" emails are a
  # different, more urgent case the user did NOT ask to reroute (currently
  # resolved by the LLM fallback, left as-is). Each is its own rule (AND of
  # from + one exact subject) rather than one OR'd rule, since the schema's
  # combinator is flat — an "any" list here would drop the from_url_pattern
  # sender scoping these generic-sounding subjects ("Transaction on hold")
  # need to avoid catching unrelated senders.
  - description: "Xoom: Update on Transaction"
    active: true
    combinator: all
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*xoom\.com$'
      - field: subject
        comparator: contains
        value: "Update on Transaction"
    action:
      add_label: billing

