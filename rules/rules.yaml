  # --- Medical ---
  # Added 2026-07-06 per user request: "subject contains Appointment AND
  # body [is from] a medical office or pharmacy" -> Category/medical.
  # Scoped by sender domain (the practice-management/reminder platforms
  # real medical/dental offices in this mailbox actually use — AdvancedMD,
  # RemindMeMD, Promptly, PromptHealth, plus a directly-owned dental
  # practice domain) rather than generic body-text keywords: real spam in
  # this mailbox already uses "APPOINTMENT" in the subject line to look
  # legitimate (e.g. "URGENT: APPOINTMENT for Shawn Becker" from a mass
  # survey sender), so a loose body match risks routing that spam here
  # too. The one body-based condition below ("pharmacy") is specific
  # enough on its own not to need the AND with subject.
  #
  # Broadened same day (still 2026-07-06) after the user separately named
  # "Dry Creek Therapy" (uses webpt.com) and "Canyon Crest Dental" (uses
  # localmed.com for scheduling and flexmail.dental for payment receipts)
  # as medical services that should route here — but their real mail
  # (COVID-19 announcements, "Don't forget about us!", payment receipts)
  # doesn't always say "Appointment" in the subject. Dropped the subject
  # condition entirely for this whole domain list: every domain here is a
  # single-purpose medical/dental practice-management platform (never
  # used for anything else), so a bare domain match carries no
  # false-positive risk the way a generic body/subject keyword would.
  - description: "Medical/dental practice platforms (any message)"
    active: true
    combinator: any
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*(advancedmd|remindmemd|promptlybyfph|prompthealth|mycanyoncrestdental|webpt|localmed)\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*flexmail\.dental$'
    action:
      add_label: medical

  - description: "Pharmacy notices (body mentions pharmacy)"
    active: true
    combinator: all
    expressions:
      - field: subject
        comparator: contains
        value: "Appointment"
      - field: body
        comparator: contains
        value: "pharmacy"
    action:
      add_label: medical

  # --- Hobby ---
  # New category added 2026-07-06 per user request: "spam with subject
  # that includes 'hobby' or 'kitlinx' reroute to new category hobby".
  # Scoped by sender domain rather than a bare subject-contains-"hobby"
  # match: real mail in this mailbox uses the word "hobby" in unrelated
  # contexts too (e.g. a historyfacts.com trivia newsletter — "George
  # Washington's surprising hobby" — and a Quizlet marketing email —
  # "New year, new hobby?"), so a loose keyword match would misroute
  # those. Each domain below is a dedicated hobby/model-kit retailer:
  # newtype.us and ak-interactive.com sell hobby paint/model kits;
  # smartcart.com sends the "Kitlinx" model-kit newsletter; the
  # hobbylinc/mrshobby patterns are unanchored substring matches against
  # the full from address to catch subaddressed/forwarded sender formats
  # (e.g. "noreply=hobbylinc.com@vrmailer3.com", "mrshobby@<id>.mailchimpapp.com").
  - description: "Hobby / model-kit retailers"
    active: true
    combinator: any
    expressions:
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*newtype\.us$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*ak-interactive\.com$'
      - field: from_url_pattern
        comparator: matches
        value: '@([\w-]+\.)*smartcart\.com$'
      - field: from_url_pattern
        comparator: matches
        value: 'hobbylinc'
      - field: from_url_pattern
        comparator: matches
        value: 'mrshobby'
    action:
      add_label: hobby

  # --- AI (subject fallback) ---
  # Broader than "There's an AI for that" and "AI product/tool newsletters"
  # above: catches any OTHER mail that mentions "AI" as its own word/acronym
  # in the subject (e.g. a general AI-news/tools newsletter not from one of
  # the specific vendor domains already listed). Deliberately placed at the
  # very END of the rule list, after every job/recruiter/hobby/medical/
  # billing/etc. rule above — a plain `subject contains "AI"` would
  # false-positive on "said"/"main"/"available"/"maintain" (word-boundary
  # regex via subject_pattern avoids that), but even word-boundary-safe, a
  # LOT of real recruiter/job-alert mail legitimately has "AI" as a word in
  # the subject too (e.g. "AI Engineer", "GenAI", job titles like "Sr. AI
  # Full Stack Engineer") — first-match-wins means those must be caught by
  # the more specific recruiter_job rules earlier in this file, or this
  # rule would mislabel real job leads as generic AI newsletters. Only
  # mail that reaches all the way down here without matching anything more
  # specific lands on `ai`.
  - description: "AI mentioned in subject (word-boundary, fallback)"
    active: true
    combinator: any
    expressions:
      - field: subject_pattern
        comparator: matches
        value: '\bAI\b'
    action:
      add_label: ai

